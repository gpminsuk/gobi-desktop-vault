version: 0.0.30
orchestrator:
  prompts_dir: _Settings_/Prompts
  tasks_dir: _Settings_/Tasks
  logs_dir: _Settings_/Logs
  chat_history_dir: _Settings_/Chats
  skills_dir: .claude/skills
  max_concurrent: 3
  poll_interval: 1
  file_extensions:
    - .md
    - .pdf
    - .docx
    - .doc
    - .txt
    - .epub
  captures_dir: _Settings_/History/Capture
  capture_prompt_path: _Settings_/Prompts/Ambient Canvas Brainstorming (ACB).md
defaults:
  executor: claude_code
  timeout_minutes: 30
  max_parallel: 3
  task_create: true
  task_priority: medium
  task_archived: false
nodes:
  - type: agent
    name: Enrich Ingested Content (EIC)
    input_path: Ingest/Clippings
    output_path: AI/Summary
    output_type: new_file
  - type: agent
    name: Daily Research Briefing (DRB)
    cron: 0 7 * * *
    output_path: Ingest/Research
    enabled: false
  - type: agent
    name: Topic Index Update (TIU)
    cron: 30 4 * * *
    input_path: Articles
    output_path: Topics
    enabled: false
id: gobi_desktop_vault
name: gobi_desktop_vault

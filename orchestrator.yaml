version: 0.0.30
orchestrator:
  chat_history_dir: Ingest/Chats
  captures_dir: Ingest/Captures
  skills_dir: .claude/skills
  logs_dir: .gobi/logs
  prompts_dir: .gobi/prompts
  tasks_dir: .gobi/tasks
  agents_dir: .claude/agents
  max_concurrent: 3
  poll_interval: 1
  file_extensions:
    - .md
    - .pdf
    - .docx
    - .doc
    - .txt
    - .epub
defaults:
  executor: claude_code
  timeout_minutes: 30
  max_parallel: 3
  task_create: true
  task_priority: medium
  task_archived: false
nodes:
  - type: agent
    name: Daily Research Briefing (DRB)
    cron: 0 7 * * *
    output_path: Ingest/Research
    enabled: false
id: gobi_desktop_vault
name: gobi_desktop_vault

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #fafaf7;
        --fg: #1a1a1a;
        --accent: #c8553d;
        --accent-dim: #a0432f;
        --grey-900: #f0ebe3;
        --grey-800: #e6dfd4;
        --grey-700: #d6cfc1;
        --grey-600: #b8b0a0;
        --grey-500: #6a6258;
        --border: 1px;
        --transition: 0.15s ease;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: 'Crimson Pro', Georgia, 'Times New Roman', serif;
        font-size: 1.05rem;
        line-height: 1.65;
        letter-spacing: 0.1px;
        overflow-x: hidden;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 48px;
        position: relative;
        z-index: 2;
    }

    /* Hero Section */
    .hero {
        padding: 72px 0;
        background: transparent;
        position: relative;
        overflow: hidden;
        border-bottom: var(--border) solid var(--grey-800);
    }

    .hero-content {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 32px;
    }

    .profile-pic {
        width: 80px;
        height: 80px;
        min-width: 80px;
        border: var(--border) solid var(--grey-700);
        border-radius: 2px;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        flex-shrink: 0;
    }

    .hero-info {
        flex: 1;
    }

    .hero-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }

    .hero h1 {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        line-height: 1.1;
        margin: 0;
        color: var(--fg);
    }

    .hero-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .hero-meta {
        font-size: 0.85rem;
        color: var(--grey-500);
        margin-bottom: 8px;
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.3px;
    }

    .hero-desc {
        font-size: 1.05rem;
        color: var(--grey-500);
        line-height: 1.6;
        font-family: 'Crimson Pro', Georgia, serif;
    }

    .tag {
        border: var(--border) solid var(--accent);
        padding: 5px 13px;
        font-size: 0.8rem;
        font-family: 'JetBrains Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--accent);
        background: transparent;
        transition: all var(--transition);
    }

    .tag:hover {
        background-color: var(--accent);
        color: var(--bg);
    }

    .btn {
        display: inline-block;
        border: var(--border) solid var(--accent);
        padding: 10px 28px;
        background-color: transparent;
        color: var(--accent);
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        cursor: pointer;
        transition: all var(--transition);
        font-size: 0.85rem;
        text-decoration: none;
    }

    .btn:hover {
        background-color: var(--accent);
        color: var(--bg);
        box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .btn:active {
        background-color: var(--accent-dim);
        border-color: var(--accent-dim);
    }

    .btn.outline {
        background-color: transparent;
        color: var(--accent);
    }

    .btn.outline:hover {
        background-color: var(--accent);
        color: var(--bg);
    }

    /* Section */
    section {
        padding: 80px 0;
        border-bottom: var(--border) solid var(--grey-800);
    }

    section h2 {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.8rem;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin-bottom: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--fg);
    }

    section h2::before {
        content: '';
        display: inline-block;
        width: 32px;
        height: 1px;
        background-color: var(--accent);
    }

    /* Hero Grid */
    .hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        align-items: center;
    }

    /* File Viewer Overlay */
    .file-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(250, 250, 247, 0.97);
        z-index: 1000;
        flex-direction: column;
        align-items: center;
    }

    .file-overlay.active {
        display: flex;
    }

    .file-overlay-header {
        width: 100%;
        max-width: 1100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 32px;
        flex-shrink: 0;
    }

    .file-overlay-title {
        font-family: 'Inter', sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: var(--grey-500);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .file-overlay-body {
        width: 100%;
        max-width: 1100px;
        flex: 1;
        overflow-y: auto;
        padding: 0 32px 48px;
        color: #3a3a3a;
        font-size: 1.05rem;
        line-height: 1.75;
        font-family: 'Crimson Pro', Georgia, serif;
    }

    .file-overlay-body h1, .file-overlay-body h2, .file-overlay-body h3 {
        color: var(--fg);
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        letter-spacing: -0.2px;
        margin-top: 28px;
        margin-bottom: 12px;
    }

    .file-overlay-body h1 { font-size: 1.5rem; }
    .file-overlay-body h2 { font-size: 1.25rem; }
    .file-overlay-body h3 { font-size: 1.1rem; }

    .file-overlay-body a {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
    }

    .file-overlay-body strong {
        color: var(--fg);
        font-weight: 600;
    }

    .file-overlay-body blockquote {
        border-left: 2px solid var(--accent);
        padding-left: 16px;
        margin-left: 0;
        color: var(--grey-500);
        font-style: italic;
    }

    .file-overlay-body ul, .file-overlay-body ol {
        margin-left: 20px;
        margin-top: 8px;
        margin-bottom: 8px;
    }

    .file-overlay-body code {
        background-color: var(--grey-900);
        padding: 2px 6px;
        border-radius: 2px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.88em;
        color: var(--accent-dim);
    }

    .file-overlay-body img {
        max-width: 100%;
        margin: 12px 0;
    }

    .file-overlay-loading {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--grey-500);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
    }

    /* Updates Grid Section */
    .updates-section {
        padding: 80px 0;
        border-bottom: var(--border) solid var(--grey-800);
    }

    .updates-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        align-items: start;
    }

    /* Brain Updates */
    .updates-list {
        display: flex;
        flex-direction: column;
        gap: 28px;
    }

    .update-card {
        border: var(--border) solid var(--grey-800);
        padding: 32px;
        background-color: var(--grey-900);
        transition: all var(--transition);
        display: flex;
        flex-direction: column;
        min-height: 280px;
    }

    .update-card:hover {
        border-color: var(--accent);
        box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .update-card h3 {
        font-family: 'Inter', sans-serif;
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 14px;
        letter-spacing: -0.2px;
        line-height: 1.35;
        color: var(--fg);
    }

    .permalink-icon {
        font-size: 0.75em;
        opacity: 0;
        text-decoration: none;
        transition: opacity var(--transition);
        vertical-align: middle;
    }

    .update-card:hover .permalink-icon {
        opacity: 0.5;
    }

    .permalink-icon:hover {
        opacity: 1 !important;
    }

    .update-meta {
        display: flex;
        gap: 16px;
        margin-bottom: 18px;
        font-size: 0.82rem;
        color: var(--grey-500);
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.3px;
    }

    .update-date {
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .topics {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }

    .topic-badge {
        background-color: var(--bg);
        color: var(--accent);
        border: var(--border) solid var(--accent);
        padding: 3px 11px;
        font-size: 0.72rem;
        font-family: 'JetBrains Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-weight: 500;
        cursor: pointer;
        transition: all var(--transition);
    }

    .topic-badge:hover {
        background-color: var(--accent);
        color: var(--bg);
    }

    .update-preview {
        color: var(--grey-500);
        font-size: 1rem;
        line-height: 1.65;
        font-family: 'Crimson Pro', Georgia, serif;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        position: relative;
    }

    .update-preview::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 24px;
        background: linear-gradient(transparent, var(--grey-900));
        pointer-events: none;
    }

    .update-full {
        color: #3a3a3a;
        font-size: 1rem;
        line-height: 1.7;
        font-family: 'Crimson Pro', Georgia, serif;
        max-height: 400px;
        overflow-y: auto;
    }

    .update-full a, .update-preview a {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
    }

    a.wiki-link {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px dashed var(--accent-dim);
        padding-bottom: 1px;
    }

    a.wiki-link:hover {
        border-bottom-style: solid;
    }

    .update-full strong {
        color: var(--fg);
        font-weight: 600;
    }

    .update-full em {
        font-style: italic;
        color: #555;
    }

    .update-full code {
        background-color: var(--bg);
        padding: 2px 6px;
        border-radius: 2px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.88em;
        color: var(--accent-dim);
    }

    .update-full blockquote {
        border-left: 2px solid var(--accent);
        padding-left: 14px;
        margin-left: 0;
        color: var(--grey-500);
        font-style: italic;
    }

    .update-full ul, .update-full ol {
        margin-left: 20px;
        margin-top: 8px;
        margin-bottom: 8px;
    }

    .update-full li {
        margin-bottom: 4px;
    }

    .more-button {
        text-align: center;
        margin-top: 48px;
    }

    /* Logging in state */
    .login-prompt {
        text-align: center;
        padding: 40px 20px;
        color: var(--grey-500);
    }

    .login-prompt p {
        margin-bottom: 20px;
    }

    /* Loading state */
    .loading {
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: var(--accent);
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .container {
            padding: 0 20px;
            max-width: 100%;
        }

        .hero-content {
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        .hero h1 {
            font-size: 1.55rem;
        }

        .hero-actions {
            flex-direction: column;
            width: 100%;
        }

        .btn {
            width: 100%;
            text-align: center;
        }

        section h2 {
            font-size: 1.4rem;
            margin-bottom: 32px;
        }

        .update-card {
            padding: 24px;
        }

        .updates-grid {
            grid-template-columns: 1fr;
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-grid">
                <div class="hero-content">
                    <div class="profile-pic" id="profilePic">🧠</div>
                    <div class="hero-info">
                        <div class="hero-header">
                            <h1 id="vaultTitle">Loading...</h1>
                            <div class="hero-actions">
                                <!-- HERO_LINKS:START -->
                                <!-- HERO_LINKS:END -->
                                <!-- FEATURE:INFOVIZ -->
                                <button class="btn outline" onclick="setInfoVizFilter()" style="font-size: 0.8rem; padding: 8px 16px;">INFOVIZ</button>
                                <!-- /FEATURE:INFOVIZ -->
                            </div>
                        </div>
                        <div class="hero-desc" id="vaultDesc"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- FEATURE:FILE_VIEWER -->
        <div class="file-overlay" id="fileOverlay">
            <div class="file-overlay-header">
                <span class="file-overlay-title" id="fileOverlayTitle"></span>
                <button class="overlay-close" onclick="closeFileViewer()">ESC / CLOSE</button>
            </div>
            <div class="file-overlay-body" id="fileOverlayBody"></div>
        </div>
        <!-- /FEATURE:FILE_VIEWER -->

        <!-- Brain Updates Section (2 columns) -->
        <section class="updates-section">
            <h2>Brain Updates</h2>
            <div class="updates-grid" id="updatesList">
                <div style="color: var(--grey-500); font-family: 'JetBrains Mono', monospace;">LOADING...</div>
            </div>
            <!-- FEATURE:PAGINATION -->
            <div class="more-button">
                <button class="btn outline" onclick="loadMoreUpdates()">More Updates</button>
            </div>
            <!-- /FEATURE:PAGINATION -->
        </section>

        <!-- Footer -->
        <footer style="padding: 32px 0; text-align: center;">
            <a id="footerLink" href="https://www.gobispace.com/?og=1" target="_blank" style="color: var(--grey-500); font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; text-decoration: none; letter-spacing: 1px; transition: color var(--transition);" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--grey-500)'">POWERED BY GOBI</a>
        </footer>
    </div>

    <script>
    // Configure marked
    const renderer = new marked.Renderer();
    renderer.link = function({ href, title, text }) {
        const fileMatch = href && href.match(/gobispace\.com\/@[^?]+\?file=([^&]+)/);
        let filePath = '';
        let isPopup = false;

        if (fileMatch) {
            filePath = decodeURIComponent(fileMatch[1]).replace(/\+/g, ' ');
            isPopup = true;
        } else if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:')) {
            filePath = href;
            isPopup = true;
        }

        if (isPopup) {
            const safePath = filePath.replace(/'/g, "\\'");
            const safeLabel = text.replace(/'/g, "\\'").replace(/<[^>]*>?/gm, '');
            return `<a href="#" class="wiki-link" onclick="event.preventDefault(); event.stopPropagation(); openFileViewer('${safePath}', '${safeLabel}')">${text}</a>`;
        }
        return `<a href="${href}" target="_blank" rel="noopener"${title ? ` title="${title}"` : ''}>${text}</a>`;
    };

    renderer.image = function({ href, title, text }) {
        let finalHref = href;
        if (href && !href.startsWith('http') && !href.startsWith('data:')) {
            if (vault && vault.webdriveUrl) {
                finalHref = getFileUrl(href);
            }
        }
        return `<img src="${finalHref}" alt="${text || ''}"${title ? ` title="${title}"` : ''} style="max-width:100%">`;
    };

    marked.setOptions({ renderer });

    // Global state
    let vault = null;
    let allArticles = [];
    let displayedCount = 0;
    const PAGE_SIZE = 8;
    let filterTopic = null;
    let infoVizOnly = false;

    async function init() {
        vault = gobi.vault;
        updateHeroSection();
        await loadArticles();
    }

    function updateHeroSection() {
        document.title = vault.title || 'Brain';
        document.getElementById('vaultTitle').textContent = vault.title || 'Brain';
        document.getElementById('vaultDesc').textContent = vault.description || '';

        if (vault.slug) {
            document.getElementById('footerLink').href = `https://www.gobispace.com/@${vault.slug}?og=1`;
        }

        if (vault.ownerProfilePictureUrl) {
            const picDiv = document.getElementById('profilePic');
            picDiv.style.backgroundImage = `url('${vault.ownerProfilePictureUrl}')`;
            picDiv.style.backgroundSize = 'cover';
            picDiv.style.backgroundPosition = 'center';
            picDiv.textContent = '';
        } else if (vault.thumbnailPath) {
            const picDiv = document.getElementById('profilePic');
            picDiv.style.backgroundImage = `url('${getFileUrl(vault.thumbnailPath)}')`;
            picDiv.style.backgroundSize = 'cover';
            picDiv.style.backgroundPosition = 'center';
            picDiv.textContent = '';
        }
    }

    function parseFrontmatter(content) {
        const match = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
        if (!match) return { meta: {}, body: content };

        const yamlStr = match[1];
        const body = match[2];
        const meta = {};

        yamlStr.split('\n').forEach(line => {
            const kv = line.match(/^(\w+):\s*(.*)$/);
            if (kv) {
                const key = kv[1];
                let val = kv[2].trim();
                if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
                if (val.startsWith("'") && val.endsWith("'")) val = val.slice(1, -1);
                meta[key] = val;
            } else if (line.match(/^\s+-\s+/)) {
                const lastKey = Object.keys(meta).pop();
                if (lastKey) {
                    if (!Array.isArray(meta[lastKey])) meta[lastKey] = meta[lastKey] ? [meta[lastKey]] : [];
                    meta[lastKey].push(line.replace(/^\s+-\s+/, '').replace(/^["']|["']$/g, ''));
                }
            }
        });

        if (meta.tags && !Array.isArray(meta.tags)) meta.tags = [meta.tags];

        return { meta, body };
    }

    async function loadArticles() {
        try {
            const files = await gobi.listFiles('Articles');
            const mdFiles = files.filter(f => f.name.endsWith('.md'));

            const articles = [];
            for (const file of mdFiles) {
                try {
                    const content = await gobi.readFile(`Articles/${file.name}`);
                    const { meta, body } = parseFrontmatter(content);
                    articles.push({
                        id: file.name,
                        title: meta.title || file.name.replace(/\.md$/, ''),
                        tags: meta.tags || [],
                        created: meta.created || '',
                        content: body,
                        path: `Articles/${file.name}`
                    });
                } catch (e) {
                    console.warn(`Skipped ${file.name}:`, e);
                }
            }

            articles.sort((a, b) => (b.created || '').localeCompare(a.created || ''));
            allArticles = articles;
            displayedCount = PAGE_SIZE;
            renderArticles();
        } catch (e) {
            console.error('Failed to load articles:', e);
            document.getElementById('updatesList').innerHTML =
                '<div style="color: var(--grey-500); font-family: \'JetBrains Mono\', monospace;">Failed to load articles</div>';
        }
    }

    function getFileUrl(path) {
        const { vaultId, webdriveUrl } = vault;
        const cleanPath = decodeURIComponent(path.replace(/\+/g, ' '));
        const encoded = cleanPath.split('/').map(encodeURIComponent).join('/');
        return `${webdriveUrl}/api/v1/file/raw/${vaultId}/${encoded}`;
    }

    function resolveWikiImages(markdown) {
        return markdown.replace(/!\[\[([^\]|]+)(?:\|(\d+))?\]\]/g, (_, path, width) => {
            const url = getFileUrl(path.trim());
            return width
                ? `<img src="${url}" alt="${path.trim()}" width="${width}" style="max-width:100%">`
                : `<img src="${url}" alt="${path.trim()}" style="max-width:100%">`;
        });
    }

    function resolveWikiLinks(markdown) {
        return markdown.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, path, display) => {
            const label = display || path.split('/').pop();
            const filePath = path.trim() + (path.includes('.') ? '' : '.md');
            return `<a href="#" class="wiki-link" onclick="event.preventDefault(); event.stopPropagation(); openFileViewer('${escapeHtml(filePath)}', '${escapeHtml(label)}')">${escapeHtml(label)}</a>`;
        });
    }

    function renderArticles() {
        const listContainer = document.getElementById('updatesList');

        let filtered = allArticles;

        if (filterTopic) {
            filtered = filtered.filter(a => (a.tags || []).some(t => t === filterTopic));
        }

        if (infoVizOnly) {
            filtered = filtered.filter(a =>
                a.content.toLowerCase().includes('.html') ||
                (a.tags || []).some(t => t.toLowerCase().includes('viz') || t.toLowerCase().includes('인포'))
            );
        }

        const visible = filtered.slice(0, displayedCount);

        let filterHeader = '';
        if (filterTopic || infoVizOnly) {
            filterHeader = `
                <div style="grid-column: 1 / -1; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace;">
                    <span style="color: var(--grey-500);">FILTERING BY:</span>
                    ${filterTopic ? `<span class="topic-badge" style="margin-bottom: 0;">${escapeHtml(filterTopic)}</span>` : ''}
                    ${infoVizOnly ? `<span class="topic-badge" style="margin-bottom: 0; background: var(--fg); color: var(--bg);">INFOVIZ</span>` : ''}
                    <button onclick="clearFilters()" style="background: none; border: 1px solid var(--grey-700); color: var(--grey-500); padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 0.75rem; text-transform: uppercase;">Clear</button>
                </div>
            `;
        }

        const html = visible.map((article, idx) => {
            const processed = resolveWikiLinks(resolveWikiImages(article.content));
            const renderedContent = marked.parse(processed);
            const previewContent = marked.parse(escapeHtml(article.content.substring(0, 300)));
            return `
            <div class="update-card" onclick="toggleArticleDetail(event, '${escapeHtml(article.id)}')" style="cursor: pointer;">
                <h3>${escapeHtml(article.title)}</h3>
                <div class="update-meta">
                    <span class="update-date">${article.created ? formatDate(article.created) : ''}</span>
                    <span>•</span>
                    <span>${Math.max(1, Math.ceil(article.content.length / 500))} min read</span>
                </div>
                ${article.tags?.length ? `
                    <div class="topics">
                        ${article.tags.slice(0, 3).map(t => `<span class="topic-badge" onclick="event.stopPropagation(); setTopicFilter('${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join('')}
                    </div>
                ` : ''}
                <div class="update-preview" id="preview-${idx}">${previewContent}</div>
                <div class="update-full" id="full-${idx}" style="display: none;">${renderedContent}</div>
            </div>
        `;
        }).join('');

        listContainer.innerHTML = filterHeader + (html || '<div style="color: var(--grey-500); font-family: \'JetBrains Mono\', monospace;">No matching articles found</div>');

        const moreBtn = document.querySelector('.more-button');
        if (moreBtn) moreBtn.style.display = (filtered.length > displayedCount) ? '' : 'none';
    }

    function setTopicFilter(topicName) {
        filterTopic = topicName;
        displayedCount = PAGE_SIZE;
        renderArticles();
        if (window.innerWidth <= 768) {
            document.querySelector('.updates-section').scrollIntoView({ behavior: 'smooth' });
        }
    }

    function setInfoVizFilter() {
        infoVizOnly = !infoVizOnly;
        displayedCount = PAGE_SIZE;
        renderArticles();
        document.querySelector('.updates-section').scrollIntoView({ behavior: 'smooth' });
    }

    function clearFilters() {
        filterTopic = null;
        infoVizOnly = false;
        displayedCount = PAGE_SIZE;
        renderArticles();
    }

    function toggleArticleDetail(event, articleId) {
        if (event.target.closest('a')) return;
        const card = event.currentTarget;
        const preview = card.querySelector('[id^="preview-"]');
        const full = card.querySelector('[id^="full-"]');
        if (preview.style.display !== 'none') {
            preview.style.display = 'none';
            full.style.display = 'block';
        } else {
            preview.style.display = 'block';
            full.style.display = 'none';
        }
    }

    function loadMoreUpdates() {
        displayedCount += PAGE_SIZE;
        renderArticles();
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        return date.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    // File Viewer
    async function openFileViewer(filePath, label) {
        const overlay = document.getElementById('fileOverlay');
        const title = document.getElementById('fileOverlayTitle');
        const body = document.getElementById('fileOverlayBody');

        let cleanPath = decodeURIComponent(filePath.split('?')[0].split('&')[0].trim());
        if (!cleanPath.includes('.') && !cleanPath.endsWith('/')) cleanPath += '.md';

        title.textContent = label;
        body.innerHTML = '<div class="file-overlay-loading"><div class="loading"></div> Loading…</div>';
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';

        try {
            if (cleanPath.toLowerCase().endsWith('.html')) {
                const url = getFileUrl(cleanPath);
                body.innerHTML = `<iframe src="${url}" style="width: 100%; height: 100%; border: none; background: white;"></iframe>`;
                body.style.padding = '0';
                body.style.overflow = 'hidden';
                return;
            }

            body.style.padding = '16px 48px 64px';
            body.style.overflowY = 'auto';

            const content = await gobi.readFile(cleanPath);
            const stripped = content.replace(/^---\n[\s\S]*?\n---\n*/, '');
            const processed = resolveWikiLinks(resolveWikiImages(stripped));
            body.innerHTML = marked.parse(processed);
        } catch (e) {
            body.innerHTML = `<div style="color: var(--grey-500); font-family: 'JetBrains Mono', monospace; padding: 32px;">File not found: ${escapeHtml(cleanPath)}</div>`;
        }
    }

    function closeFileViewer() {
        const overlay = document.getElementById('fileOverlay');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
        document.getElementById('fileOverlayBody').innerHTML = '';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeFileViewer();
    });

    document.getElementById('fileOverlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('fileOverlay')) closeFileViewer();
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
